name: Generation eval

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      providers:
        description: Comma-separated providers; defaults to every provider with a configured secret
        required: false
        default: ""
      cases:
        description: Comma-separated case ids from tests/evals/generation-cases.json; defaults to all
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: generation-eval
  cancel-in-progress: false

env:
  PNPM_VERSION: "10.29.3"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Without provider secrets the harness runs its deterministic fixtures,
      # so the job still verifies the pipeline and publishes a (mock) summary.
      - name: Run generation eval
        env:
          RENDERIFY_EVAL_PROVIDERS: ${{ inputs.providers }}
          RENDERIFY_EVAL_CASES: ${{ inputs.cases }}
          RENDERIFY_EVAL_OPENAI_API_KEY: ${{ secrets.RENDERIFY_EVAL_OPENAI_API_KEY }}
          RENDERIFY_EVAL_OPENAI_MODEL: ${{ vars.RENDERIFY_EVAL_OPENAI_MODEL }}
          RENDERIFY_EVAL_ANTHROPIC_API_KEY: ${{ secrets.RENDERIFY_EVAL_ANTHROPIC_API_KEY }}
          RENDERIFY_EVAL_ANTHROPIC_MODEL: ${{ vars.RENDERIFY_EVAL_ANTHROPIC_MODEL }}
          RENDERIFY_EVAL_GOOGLE_API_KEY: ${{ secrets.RENDERIFY_EVAL_GOOGLE_API_KEY }}
          RENDERIFY_EVAL_GOOGLE_MODEL: ${{ vars.RENDERIFY_EVAL_GOOGLE_MODEL }}
        run: pnpm eval:generation

      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generation-eval
          path: .artifacts/evals/
          if-no-files-found: warn
